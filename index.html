<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Orçamento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Orçamento</h1>

  <form id="formulario">
    <input type="text" id="nome" placeholder="Produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="preco" placeholder="Preço">
    <button type="submit">Adicionar</button>
  </form>

  <h2>Itens</h2>
  <div id="lista">
  </div>

  <p>Desconto (%): <input type="number" id="desconto" value="0"></p>

  <p>Subtotal: R$ <span id="subtotal">0</span></p>
  <p>Total com desconto: R$ <span id="total">0</span></p>

  <script src="main.js"></script>
</body>
</html>
